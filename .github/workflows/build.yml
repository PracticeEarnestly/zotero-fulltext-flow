name: Build FullTextFlow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:local
      - name: Check Zotero 10 compatibility metadata
        run: |
          python3 - <<'PY'
          import json
          manifest = json.load(open("addon/manifest.json", encoding="utf-8"))
          assert manifest["applications"]["zotero"]["strict_max_version"] == "10.0.*"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fulltextflow-xpi
          path: |
            fulltextflow-*.xpi
            fulltextflow-*.xpi.sha256
            update.json
      - name: Read release version
        id: release_version
        run: |
          echo "value=$(node -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: release_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.release_version.outputs.value }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish versioned XPI release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.value }}
          name: FullTextFlow v${{ steps.release_version.outputs.value }}
          generate_release_notes: true
          files: |
            fulltextflow-*.xpi
            fulltextflow-*.xpi.sha256
            update.json
