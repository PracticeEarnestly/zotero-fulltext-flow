name: Bootstrap FullTextFlow source

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 -d > /tmp/fulltextflow-source.zip
          rm -rf /tmp/fulltextflow-source
          mkdir -p /tmp/fulltextflow-source
          unzip -q /tmp/fulltextflow-source.zip -d /tmp/fulltextflow-source
          test -f /tmp/fulltextflow-source/zotero-fulltext-flow/package.json
      - name: Replace bootstrap files with source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git/' /tmp/fulltextflow-source/zotero-fulltext-flow/ ./
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FullTextFlow Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Import FullTextFlow 0.2.3 source'
          git push origin HEAD:main
