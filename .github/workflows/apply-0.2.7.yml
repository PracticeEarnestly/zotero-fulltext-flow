name: Apply FullTextFlow 0.2.7 retrieval strategy

on:
  push:
    paths:
      - '.github/workflows/apply-0.2.7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 0.2.7 source changes
        run: python scripts/apply_0_2_7.py
      - name: Commit patch to develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PracticeEarnestly"
          git config user.email "47146733+PracticeEarnestly@users.noreply.github.com"
          git add src/core/RetrievalStrategy.ts src/core/QueueStore.ts src/core/FlowEngine.ts src/ui/Menus.ts addon/prefs.js scripts/build_local.py package.json README.md CHANGELOG.md
          git commit -m "Add configurable retrieval strategies for 0.2.7"
          git push origin HEAD:develop
