name: Release v0.2.6

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.6.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build XPI
        run: npm run build:local

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f fulltextflow-0.2.6.xpi
          test -f fulltextflow-0.2.6.xpi.sha256
          sha256sum -c fulltextflow-0.2.6.xpi.sha256

      - name: Write release notes
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## FullTextFlow 0.2.6

          This release fixes a false-positive JLSS login state where an old API token could remain usable even after the JLSS website session had expired.

          ### Highlights
          - Separates JLSS API-token validation from embedded web-session validation.
          - Shows full login success only when both API and web session are confirmed.
          - Distinguishes `API available but web session unconfirmed` from true login success.
          - Detects expired web sessions from login-route, password-field, and login/register markers.
          - Keeps a still-valid API token during browser-session re-login so active background tasks are not interrupted unnecessarily.
          - Includes direct DOM and Gecko frame-script session probes for Zotero/Firefox process isolation.
          - Retains the 0.2.5 stable HTML task-table UI and 0.2.4 JLSS task diagnostics.

          ### Installation
          Download `fulltextflow-0.2.6.xpi`, then in Zotero open **Tools → Plugins → Install Plugin From File...**.

          ### Verification
          The accompanying `fulltextflow-0.2.6.xpi.sha256` file can be used to verify the downloaded XPI.

          ### Acknowledgement
          The early Zotero–JLSS workflow design was informed by the open-source project HiYvri/pdf-fetcher:
          https://github.com/HiYvri/pdf-fetcher

          FullTextFlow is independently maintained and is not affiliated with Zotero or JLSS/聚联医疗.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.2.6 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.2.6 \
            fulltextflow-0.2.6.xpi \
            fulltextflow-0.2.6.xpi.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target 8fa766c0e784c5a6db80c925a0f1668dfac62d6f \
            --title 'FullTextFlow 0.2.6' \
            --notes-file /tmp/release-notes.md \
            --latest
